name: Verify and Bundle

on:
  push:
    branches: [main, feat/port-9router-rtk-upstream]
    paths:
      - '**/*.ts'
      - '**/*.js'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - '.github/workflows/verify-and-bundle.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blackrouter-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run type-check

      - name: Unit tests
        run: bun test

      - name: Build OpenChamber bundles
        run: bun run build

      - name: Commit generated guest bundles when changed
        shell: bash
        run: |
          if git diff --quiet -- service/main.js panel/main.js status/main.js; then
            echo "Guest bundles are already up to date."
            exit 0
          fi

          # Only publish if the branch head is still the commit this job verified.
          target_branch="${GITHUB_REF_NAME}"
          git fetch origin "$target_branch"
          checkout_sha="$(git rev-parse HEAD)"
          remote_sha="$(git rev-parse "origin/${target_branch}")"
          if [[ "$checkout_sha" != "$remote_sha" ]]; then
            echo "Branch advanced during verification; skip this bundle commit so the newest run can build from current source."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add service/main.js panel/main.js status/main.js
          git commit -m "build: sync OpenChamber guest bundles"
          if ! git push origin "HEAD:${target_branch}"; then
            echo "Branch advanced while publishing; the newer push will trigger another bundle build."
            exit 0
          fi
